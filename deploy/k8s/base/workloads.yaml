---
apiVersion: apps/v1
kind: Deployment
metadata: {name: live-interaction}
spec:
  replicas: 2
  selector: {matchLabels: {app: live-interaction}}
  template:
    metadata: {labels: {app: live-interaction}}
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets: [{name: ghcr-secret}]
      containers:
        - name: live-interaction
          image: live-platform
          command: [live-interaction]
          ports: [{name: http, containerPort: 8082}]
          envFrom:
            - configMapRef: {name: live-platform-config}
            - secretRef: {name: live-platform-runtime}
          # Read-only transitional dependency; reserve a small slice of the
          # MySQL connection budget until Stage 4 projections remove it.
          env:
            - {name: MYSQL_MAX_OPEN_CONNS, value: '5'}
            - {name: MYSQL_MAX_IDLE_CONNS, value: '2'}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
---
