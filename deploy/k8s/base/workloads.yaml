apiVersion: apps/v1
kind: Deployment
metadata: {name: live-worker-stats}
spec:
  # No room ownership lease exists yet. Keep exactly one stats aggregator; it
  # must not receive a generic HPA before distributed ownership is implemented.
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: live-worker-stats}}
  template:
    metadata: {labels: {app: live-worker-stats, app.kubernetes.io/component: worker}}
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets: [{name: ghcr-secret}]
      containers:
        - name: live-worker-stats
          image: live-platform
          command: [live-worker]
          ports: [{name: metrics, containerPort: 9090}]
          envFrom:
            - configMapRef: {name: live-platform-config}
            - secretRef: {name: live-platform-runtime}
          env: [{name: WORKER_ROLES, value: stats}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /ready, port: metrics}, initialDelaySeconds: 5, periodSeconds: 5}
---
