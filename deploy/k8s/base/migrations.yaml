apiVersion: v1
kind: ConfigMap
metadata:
  name: live-platform-migrations
data:
  001_init.sql: |
    CREATE TABLE IF NOT EXISTS schema_probe (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3)
    );
  002_m2.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        username VARCHAR(32) NOT NULL,
        nickname VARCHAR(64) NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        status TINYINT NOT NULL DEFAULT 1,
        created_at DATETIME(3) NOT NULL,
        updated_at DATETIME(3) NOT NULL,
        UNIQUE KEY uk_users_username(username)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS live_rooms (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        anchor_id BIGINT NOT NULL,
        title VARCHAR(100) NOT NULL,
        status VARCHAR(16) NOT NULL,
        started_at DATETIME(3) NULL,
        ended_at DATETIME(3) NULL,
        created_at DATETIME(3) NOT NULL,
        updated_at DATETIME(3) NOT NULL,
        KEY idx_live_rooms_anchor(anchor_id),
        KEY idx_live_rooms_status(status)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS live_sessions (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        room_id BIGINT NOT NULL,
        user_id BIGINT NOT NULL,
        joined_at DATETIME(3) NOT NULL,
        last_seen_at DATETIME(3) NOT NULL,
        status TINYINT NOT NULL DEFAULT 1,
        UNIQUE KEY uk_live_sessions_room_user(room_id, user_id),
        KEY idx_live_sessions_room_status(room_id, status)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS room_mutes (
        room_id BIGINT NOT NULL,
        user_id BIGINT NOT NULL,
        muted_until DATETIME(3) NULL,
        created_by BIGINT NOT NULL,
        reason VARCHAR(255) NOT NULL DEFAULT '',
        created_at DATETIME(3) NOT NULL,
        updated_at DATETIME(3) NOT NULL,
        PRIMARY KEY(room_id, user_id),
        KEY idx_room_mutes_until(muted_until)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS room_bans (
        room_id BIGINT NOT NULL,
        user_id BIGINT NOT NULL,
        created_by BIGINT NOT NULL,
        reason VARCHAR(255) NOT NULL DEFAULT '',
        created_at DATETIME(3) NOT NULL,
        PRIMARY KEY(room_id, user_id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
  003_m4.sql: |
    CREATE TABLE IF NOT EXISTS gifts (
        id BIGINT PRIMARY KEY,
        name VARCHAR(64) NOT NULL,
        price BIGINT NOT NULL,
        status TINYINT NOT NULL DEFAULT 1,
        created_at DATETIME(3) NOT NULL,
        updated_at DATETIME(3) NOT NULL,
        CHECK (price >= 0),
        KEY idx_gifts_status(status)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS wallets (
        user_id BIGINT PRIMARY KEY,
        balance BIGINT NOT NULL DEFAULT 0,
        version BIGINT NOT NULL DEFAULT 0,
        updated_at DATETIME(3) NOT NULL,
        CHECK (balance >= 0)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS wallet_transactions (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        transaction_no VARCHAR(64) NOT NULL,
        user_id BIGINT NOT NULL,
        biz_type VARCHAR(32) NOT NULL,
        biz_id VARCHAR(64) NOT NULL,
        amount BIGINT NOT NULL,
        balance_before BIGINT NOT NULL,
        balance_after BIGINT NOT NULL,
        created_at DATETIME(3) NOT NULL,
        UNIQUE KEY uk_wallet_transactions_no(transaction_no),
        KEY idx_wallet_transactions_user_created(user_id, created_at),
        KEY idx_wallet_transactions_biz(biz_type, biz_id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS gift_orders (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        order_no VARCHAR(64) NOT NULL,
        request_id VARCHAR(128) NOT NULL,
        user_id BIGINT NOT NULL,
        anchor_id BIGINT NOT NULL,
        room_id BIGINT NOT NULL,
        gift_id BIGINT NOT NULL,
        gift_count BIGINT NOT NULL,
        unit_price BIGINT NOT NULL,
        total_amount BIGINT NOT NULL,
        status TINYINT NOT NULL,
        created_at DATETIME(3) NOT NULL,
        updated_at DATETIME(3) NOT NULL,
        UNIQUE KEY uk_gift_orders_order_no(order_no),
        UNIQUE KEY uk_gift_orders_request_id(request_id),
        KEY idx_gift_orders_user_created(user_id, created_at),
        KEY idx_gift_orders_room_created(room_id, created_at),
        CHECK (gift_count > 0),
        CHECK (unit_price >= 0),
        CHECK (total_amount >= 0)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    INSERT INTO gifts(id, name, price, status, created_at, updated_at) VALUES
        (1, 'Rose', 100, 1, NOW(3), NOW(3)),
        (2, 'Rocket', 10000, 1, NOW(3), NOW(3)),
        (3, 'Castle', 50000, 1, NOW(3), NOW(3))
    ON DUPLICATE KEY UPDATE name=VALUES(name), price=VALUES(price), status=VALUES(status), updated_at=NOW(3);

    INSERT INTO wallets(user_id, balance, version, updated_at)
    SELECT id, 0, 0, NOW(3) FROM users
    ON DUPLICATE KEY UPDATE user_id=user_id;
  004_m5.sql: |
    CREATE TABLE IF NOT EXISTS outbox_events (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        event_id VARCHAR(64) NOT NULL,
        aggregate_type VARCHAR(32) NOT NULL,
        aggregate_id VARCHAR(64) NOT NULL,
        event_type VARCHAR(64) NOT NULL,
        topic VARCHAR(128) NOT NULL,
        partition_key VARCHAR(128) NOT NULL,
        payload JSON NOT NULL,
        status TINYINT NOT NULL DEFAULT 0,
        retry_count INT NOT NULL DEFAULT 0,
        next_retry_at DATETIME(3) NULL,
        locked_by VARCHAR(64) NULL,
        locked_at DATETIME(3) NULL,
        last_error VARCHAR(512) NULL,
        created_at DATETIME(3) NOT NULL,
        published_at DATETIME(3) NULL,
        UNIQUE KEY uk_outbox_event_id(event_id),
        KEY idx_outbox_dispatch(status, next_retry_at, id),
        KEY idx_outbox_lock(status, locked_at)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS processed_events (
        consumer_group VARCHAR(128) NOT NULL,
        event_id VARCHAR(64) NOT NULL,
        status TINYINT NOT NULL DEFAULT 0,
        locked_at DATETIME(3) NULL,
        processed_at DATETIME(3) NULL,
        last_error VARCHAR(512) NULL,
        created_at DATETIME(3) NOT NULL,
        PRIMARY KEY (consumer_group, event_id),
        KEY idx_processed_status(status, locked_at)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS danmaku_records (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        message_id VARCHAR(64) NOT NULL,
        room_id BIGINT NOT NULL,
        user_id BIGINT NOT NULL,
        nickname VARCHAR(64) NOT NULL,
        content VARCHAR(512) NOT NULL,
        created_at DATETIME(3) NOT NULL,
        UNIQUE KEY uk_danmaku_message_id(message_id),
        KEY idx_danmaku_room_created(room_id, created_at),
        KEY idx_danmaku_user_created(user_id, created_at)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
