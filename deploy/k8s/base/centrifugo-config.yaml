apiVersion: v1
kind: ConfigMap
metadata:
  name: centrifugo-config
data:
  config.json: |
    {
      "client": {
        "token": {"hmac_secret_key": "overridden-by-CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY"},
        "allowed_origins": ["http://43.136.82.118:30082"],
        "queue_max_size": 262144
      },
      "http_api": {
        "key": "overridden-by-CENTRIFUGO_HTTP_API_KEY",
        "error_mode": "transport"
      },
      "channel": {
        "namespaces": [
          {
            "name": "room",
            "history_size": 100,
            "history_ttl": "30s",
            "force_recovery": true,
            "channel_regex": "^[0-9]+:(stream|stats)$"
          },
          {"name": "personal", "allow_user_limited_channels": true}
        ]
      },
      "engine": {"type": "redis", "redis": {"address": "redis://redis:6379/1"}},
      "health": {"enabled": true},
      "prometheus": {"enabled": true, "instrument_http_handlers": true, "recovered_publications_histogram": true},
      "shutdown": {"timeout": "15s"}
    }
