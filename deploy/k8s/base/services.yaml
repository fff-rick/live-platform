apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: mysql}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: redis}]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: kafka}]
---
apiVersion: v1
kind: Service
metadata:
  name: centrifugo
spec:
  type: NodePort
  selector: {app: centrifugo}
  ports:
    - name: http-ws
      port: 8000
      targetPort: centrifugo
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: live-api
spec:
  type: NodePort
  selector: {app: live-api}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: live-commerce
spec:
  selector: {app: live-commerce}
  ports: [{name: http, port: 8081, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: live-interaction
spec:
  selector: {app: live-interaction}
  ports: [{name: http, port: 8082, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: live-identity-room}
spec:
  selector: {app: live-identity-room}
  ports: [{name: http, port: 8083, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: live-worker-metrics
spec:
  # One metrics Service exposes the independently deployed Worker roles to a
  # future Prometheus ServiceMonitor without coupling their business traffic.
  selector: {app.kubernetes.io/component: worker}
  ports: [{name: metrics, port: 9090, targetPort: metrics}]
