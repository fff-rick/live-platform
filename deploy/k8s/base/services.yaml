apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: mysql}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: redis}]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: kafka}]
---
apiVersion: v1
kind: Service
metadata:
  name: centrifugo
spec:
  type: NodePort
  selector: {app: centrifugo}
  ports:
    - name: http-ws
      port: 8000
      targetPort: centrifugo
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: live-api
spec:
  type: NodePort
  selector: {app: live-api}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: live-worker
spec:
  selector: {app: live-worker}
  ports: [{name: metrics, port: 9090, targetPort: metrics}]
