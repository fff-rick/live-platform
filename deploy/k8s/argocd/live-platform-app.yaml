apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: live-platform-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fff-rick/live-platform.git
    targetRevision: main
    path: deploy/k8s/overlays/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: live-platform
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
