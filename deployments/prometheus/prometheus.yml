global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: live-api
    static_configs:
      - targets: ["live-api:8080"]

  - job_name: live-worker
    static_configs:
      - targets: ["live-worker:9090"]

  - job_name: centrifugo
    static_configs:
      - targets: ["centrifugo:8000"]
