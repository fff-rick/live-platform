map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8000;
  # Docker's embedded resolver returns all scaled centrifugo containers. The
  # variable form makes nginx refresh DNS instead of pinning its first answer.
  resolver 127.0.0.11 valid=5s;
  location / {
    set $centrifugo_upstream http://centrifugo:8000;
    proxy_pass $centrifugo_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 65s;
  }
}
