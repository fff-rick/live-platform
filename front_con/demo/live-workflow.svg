<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">LUMI LIVE 直播互动流程</title>
  <desc id="desc">从登录和开播开始，依次进房、建立实时连接、产生互动、异步持久化并进入可观测系统。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dy="6" stdDeviation="7" flood-color="#25304a" flood-opacity=".1"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#939caf"/></marker>
    <style>.h{font:700 18px Inter,"Noto Sans SC",sans-serif;fill:#20263a}.n{font:700 14px Inter,sans-serif;fill:#fff}.t{font:400 13px Inter,"Noto Sans SC",sans-serif;fill:#747d91}.line{stroke:#939caf;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="#f8f9fc"/>
  <text x="50" y="54" class="h">一次完整的直播互动</text><text x="50" y="80" class="t">HTTP 负责业务命令，WebSocket 负责实时分发，Kafka 承接异步链路</text>
  <g filter="url(#shadow)">
    <g transform="translate(45 122)"><rect width="150" height="104" rx="16" fill="#fff" stroke="#dfe3ec"/><circle cx="30" cy="31" r="16" fill="#7a8cff"/><text x="26" y="36" class="n">1</text><text x="55" y="36" class="h">登录开播</text><text x="22" y="72" class="t">JWT 与房间生命周期</text></g>
    <g transform="translate(235 122)"><rect width="150" height="104" rx="16" fill="#fff" stroke="#dfe3ec"/><circle cx="30" cy="31" r="16" fill="#00aeec"/><text x="26" y="36" class="n">2</text><text x="55" y="36" class="h">观众进房</text><text x="22" y="72" class="t">订阅令牌与在线 TTL</text></g>
    <g transform="translate(425 122)"><rect width="150" height="104" rx="16" fill="#fff" stroke="#dfe3ec"/><circle cx="30" cy="31" r="16" fill="#00aeec"/><text x="26" y="36" class="n">3</text><text x="55" y="36" class="h">实时连接</text><text x="22" y="72" class="t">Centrifugo WebSocket</text></g>
    <g transform="translate(615 122)"><rect width="150" height="104" rx="16" fill="#fff" stroke="#dfe3ec"/><circle cx="30" cy="31" r="16" fill="#8b5cf6"/><text x="26" y="36" class="n">4</text><text x="55" y="36" class="h">产生互动</text><text x="22" y="72" class="t">弹幕、点赞与礼物</text></g>
    <g transform="translate(805 122)"><rect width="150" height="104" rx="16" fill="#fff" stroke="#dfe3ec"/><circle cx="30" cy="31" r="16" fill="#d946ef"/><text x="26" y="36" class="n">5</text><text x="55" y="36" class="h">可靠投递</text><text x="22" y="72" class="t">事务 Outbox 与 Kafka</text></g>
    <g transform="translate(995 122)"><rect width="160" height="104" rx="16" fill="#252d40"/><circle cx="30" cy="31" r="16" fill="#ffe3ed"/><text x="26" y="36" style="font:700 14px Inter,sans-serif;fill:#cf456f">6</text><text x="55" y="36" style="font:700 18px Inter,'Noto Sans SC',sans-serif;fill:#fff">归档观测</text><text x="22" y="72" style="font:400 13px Inter,'Noto Sans SC',sans-serif;fill:#e9edf7">历史、指标与 Trace</text></g>
  </g>
  <path d="M195 174H235M385 174H425M575 174H615M765 174H805M955 174H995" class="line"/>
</svg>
