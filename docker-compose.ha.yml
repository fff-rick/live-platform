# Local HA rehearsal overlay. Use together with docker-compose.yml; it is not a
# production deployment because every container and volume remains on one host.
services:
  kafka:
    hostname: kafka-1
    networks:
      default:
        aliases: [kafka-1]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka-1:19092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes: [kafka_1_data:/var/lib/kafka/data]
    restart: unless-stopped

  kafka-2: &kafka-node
    image: apache/kafka:4.3.1
    hostname: kafka-2
    environment: &kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes: [kafka_2_data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kafka-3:
    <<: *kafka-node
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092
    volumes: [kafka_3_data:/var/lib/kafka/data]

  kafka-init:
    depends_on:
      kafka: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --create --if-not-exists --topic live.danmaku.v1 --partitions 6 --replication-factor 3 --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --create --if-not-exists --topic live.gift.v1 --partitions 6 --replication-factor 3 --config min.insync.replicas=2

  live-api:
    environment: &ha-app-env
      KAFKA_BROKERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      CENTRIFUGO_API_URL: http://centrifugo-gateway:8000/api
    restart: unless-stopped
  live-commerce:
    environment: *ha-app-env
    restart: unless-stopped
  live-interaction:
    environment: *ha-app-env
    restart: unless-stopped
  live-identity-room:
    environment: *ha-app-env
    restart: unless-stopped
  live-worker:
    environment: *ha-app-env
    restart: unless-stopped

  centrifugo:
    # The base file publishes 8000. Remove that fixed host binding before
    # scaling; the gateway below owns the one externally visible port.
    ports: !reset []
    deploy: {replicas: 3}
    restart: unless-stopped

  centrifugo-gateway:
    image: nginx:1.29-alpine
    ports: ["8000:8000"]
    volumes:
      - ./deployments/nginx/centrifugo-ha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [centrifugo]
    restart: unless-stopped

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
